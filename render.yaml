services:
  # 1. Render Static Site (Fast, Free Tier Static SPA Hosting)
  - type: web
    name: aurachat1
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. Render Web Service (Node.js Express Fullstack Hosting with Server Proxy)
  - type: web
    name: aurachat1-server
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
